name: CI

on:
  push:
    branches: [master, revival]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
      - name: Install ffmpeg (Homebrew, arm64 runners)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Show ffmpeg
        run: ffmpeg -version | head -1
        shell: bash
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[numpy,scipy]"
      - name: Test (C audioop backend)
        run: |
          python -c "import pydub.utils as u; print('backend:', u.audioop_backend)"
          python -m unittest test.test test.test_pyaudioop test.test_modern -v 2>&1 | tail -30
        shell: bash
      - name: Test pure-Python audioop fallback
        if: matrix.python == '3.13' || matrix.python == '3.14'
        run: |
          python -m pip uninstall -y audioop-lts
          python -c "import pydub.utils as u; assert u.audioop_backend == 'pyaudioop', u.audioop_backend"
          python -m unittest test.test test.test_pyaudioop test.test_modern 2>&1 | tail -5
        shell: bash
      - name: Test fallback without numpy
        if: matrix.python == '3.14' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pip uninstall -y numpy scipy
          python -c "import pydub.pyaudioop as p; assert not p.use_numpy"
          python -m unittest test.test 2>&1 | tail -5
        shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile with warnings as errors (catches invalid escape sequences)
        run: python -W error -m compileall -q pydub test
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -la dist
