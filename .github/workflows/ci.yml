name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Install dev deps
        run: |
          python -m pip install ruff black pytest pytest-cov
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest (with coverage)
        run: pytest -q --cov=pydub --cov-report=term-missing

      - name: Install dependencies
        run: |
            python -m pip install -U pip
            pip install pre-commit ruff black pytest pytest-cov numpy scipy
            python - <<'PY'

            import sys, subprocess
            if sys.version_info >= (3, 13):
                subprocess.check_call([sys.executable, "-m", "pip", "install", "audioop-lts"])
            PY
                pip install -e .
      - name: Run tests
        run: |
            pytest -q --cov=pydub --cov-report=term-missing --cov-fail-under=25